<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 任务续接 · 设置入口</title>
<script>/*__TASK_RESUME_I18N__*/</script>
<style>
:root{color-scheme:light;--bg:#fff;--text:#222b3a;--muted:#758095;--border:#e7ebf3;--soft:#f5f7fb;--accent:#3564e8;--wash:#eef3ff;font:13px/1.65 "Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif}html[data-theme=dark]{color-scheme:dark;--bg:#20242d;--text:#edf0f7;--muted:#a0abc1;--border:#343d4d;--soft:#272d39;--accent:#88a8ff;--wash:#293550}@media(prefers-color-scheme:dark){html:not([data-theme=light]){color-scheme:dark;--bg:#20242d;--text:#edf0f7;--muted:#a0abc1;--border:#343d4d;--soft:#272d39;--accent:#88a8ff;--wash:#293550}}*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg)}main{padding:24px 26px;max-width:750px;margin:auto}.top{display:flex;gap:13px;align-items:center}.mark{display:grid;place-items:center;flex-shrink:0;width:45px;height:45px;border-radius:14px;color:white;background:linear-gradient(145deg,#4e7dfc,#2853cd);box-shadow:0 5px 13px #3564e826}.mark svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}h1{font-size:17px;letter-spacing:-.3px;line-height:1.45;margin:0 0 4px}.sub{font-size:11px;color:var(--muted);margin:0}.version{margin-left:auto;font-size:10px;border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--muted)}.rule{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--border);border-radius:11px;margin-top:20px;background:var(--soft);padding:13px 0}.rule>div{padding:0 16px}.rule>div+div{border-left:1px solid var(--border)}.rule small{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.rule strong{font-size:15px;font-weight:650}.rule strong span{font-size:10px;font-weight:500;color:var(--muted);margin-left:3px}.actions{display:flex;align-items:center;gap:14px;margin-top:20px}button{border:0;border-radius:9px;color:#fff;background:#3564e8;font:600 12px "Segoe UI","Microsoft YaHei",sans-serif;padding:10px 15px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}button:hover{background:#2855d5}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #a9bfff;outline-offset:3px}button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.actions p{font-size:10px;color:var(--muted);margin:0;line-height:1.8}#status{font-size:10px;color:var(--muted);margin:13px 0 0;min-height:17px}#status[data-error=true]{color:#c74444}@media(max-width:430px){main{padding:20px}.rule>div{padding:0 11px}.rule strong{font-size:13px}.actions{align-items:start;flex-direction:column;gap:9px}.version{display:none}h1{font-size:16px}}
.mark{background:transparent;box-shadow:none;overflow:hidden}.mark img{display:block;width:100%;height:100%;object-fit:contain;border-radius:9px}.steps{align-items:start}</style></head><body>
<main><header class="top"><span class="mark" aria-hidden="true"><img src="__TASK_RESUME_ICON__" alt="" aria-hidden="true"></span><div><h1>Codex 任务续接</h1><p class="sub">设置触发规则，让未完成的任务在额度恢复后继续。</p></div><span class="version">v1.0</span></header>
<div class="rule" aria-label="已保存参数"><div><small>剩余额度低于</small><strong id="threshold">—</strong></div><div><small>刷新后等待</small><strong id="delay">—</strong></div><div><small>已保存的开关</small><strong id="enabled">—</strong></div></div>
<div class="actions"><button id="open" type="button">打开设置弹窗<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button><p>含参数设置与四步使用指南。<br>弹窗内保存参数，不需要反复发送对话。</p></div>
<p id="status" role="status" aria-live="polite">这里显示保存的参数，不代表检测脚本已经受信任。</p></main>
<script>
const {t}=window.TaskResumeI18n;window.TaskResumeI18n.staticText(document);
function render(result){const v=result?.summary;if(!v)return;document.getElementById('threshold').textContent=v.threshold+'%';document.getElementById('delay').textContent=v.delayMinutes+t(' 分钟');document.getElementById('enabled').textContent=v.monitoringEnabled?t('已开启'):t('已关闭');}
if(window.openai?.toolOutput)render(window.openai.toolOutput);
document.getElementById('open').addEventListener('click',async()=>{
 const button=document.getElementById('open'),status=document.getElementById('status');status.dataset.error='false';
 if(typeof window.openai?.requestModal!=='function'){status.textContent=t('当前客户端未提供弹窗接口。请点击插件原生设置中的“管理 Codex 任务续接”，或固定应用入口“Codex 任务续接 · 管理”。');status.dataset.error='true';return;}
 button.disabled=true;
 try{await window.openai.requestModal({template:'ui://task-resume/settings-studio-20261018-balanced-switches.html',params:{}});status.textContent=t('已请求客户端打开设置弹窗。保存后可在面板内确认结果。');}
 catch(error){status.textContent=t('弹窗未打开：')+(error?.message||t('客户端拒绝了请求。'));status.dataset.error='true';}
 finally{button.disabled=false;}
});
if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',id:'launcher-init',method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'Task Resume Settings Launcher',version:'1.0.0'},appCapabilities:{}}},'*');
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;const m=event.data;if(m.id==='launcher-init'&&m.result){const theme=m.result.hostContext?.theme;if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},event.origin==='null'?'*':event.origin);}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent);if(m.method==='ui/notifications/host-context-changed'){const theme=m.params?.theme;if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;}});
new ResizeObserver(()=>{if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)}},'*');}).observe(document.querySelector('main'));
</script></body></html>
